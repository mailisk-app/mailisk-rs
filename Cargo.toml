[package]
name = "mailisk"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Typed async Rust client for the Mailisk API"
license = "MIT"
readme = "README.md"
homepage = "https://mailisk.com"
documentation = "https://docs.rs/mailisk"
repository = "https://github.com/mailisk-app/mailisk-rs"
keywords = ["mailisk", "email", "sms", "testing", "totp"]
categories = ["api-bindings", "email", "development-tools::testing"]
exclude = ["/.env*"]

[features]
default = ["rustls"]
# TLS backend for reqwest. Enable exactly one when disabling default features.
rustls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "json", "query", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
